server:
  port: 8888
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.entity
  configuration:
    map-underscore-to-camel-case: true
spring:
  # 本地开发参数从项目根目录的 .env 文件加载（可选：文件不存在也不影响启动）
  # 真实部署时请改为通过系统环境变量注入，环境变量优先级高于此文件
  config:
    import: "optional:file:./.env[.properties]"
  data:
    redis:
      database: 7
      password: ${REDIS_PASSWORD:}
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 1000ms
  # 缓存名称前缀（避免不同项目缓存key冲突）
  cache:
    redis:
      key-prefix: "hot_data:"  # 缓存key前缀：hot_data:xxx
      use-key-prefix: true  # 启用前缀
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:tea}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&allowMultiQueries=true
    password: ${MYSQL_PASSWORD:123456}
    username: ${MYSQL_USERNAME:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: ${OPENAI_BASE_URL}
      chat:
        options:
          model: ${OPENAI_MODEL:deepseek-v4.1-flash}
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:qwen3.7-text-embedding}
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}


jwt:
  secret: ${JWT_SECRET}
  expire: ${JWT_EXPIRE:72000000}

alioss:
  access-key-id: ${OSS_ACCESS_KEY_ID}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET}
  bucket-name: ${OSS_BUCKET_NAME}
  endpoint: ${OSS_ENDPOINT}

# ==================== AI 记忆 / RAG 参数 ====================
tea:
  mcp:
    express:
      # 快递查询 MCP(DashScope) 的 API Key，禁止硬编码
      api-key: ${MCP_EXPRESS_API_KEY:}
  ai:
    memory:
      # 短期记忆窗口大小
      max-messages: ${AI_MEMORY_MAX_MESSAGES:20}
      # 从 sys_history 单次读取的消息条数（建议 >= max-messages）
      window-size: ${AI_MEMORY_WINDOW_SIZE:20}
      # 长期记忆语义召回条数
      long-term-top-k: ${AI_LTM_TOP_K:5}
    rag:
      # 向量召回条数
      vector-top-k: ${AI_RAG_VECTOR_TOP_K:5}
      # 向量相似度阈值
      similarity-threshold: ${AI_RAG_SIMILARITY_THRESHOLD:0.5}
      # BM25(MySQL 全文) 召回条数
      bm25-top-k: ${AI_RAG_BM25_TOP_K:5}
      # RRF 融合后候选条数
      hybrid-top-k: ${AI_RAG_HYBRID_TOP_K:5}
      # RRF 平滑参数
      rrf-k: ${AI_RAG_RRF_K:60}
      # 是否开启重排
      rerank-enabled: ${AI_RAG_RERANK_ENABLED:true}
      # 重排后送入上下文的条数
      rerank-top-n: ${AI_RAG_RERANK_TOP_N:3}
    rerank:
      # 重排模型（阿里云百炼原生 rerank 路由）
      model: ${AI_RERANK_MODEL:qwen3.7-text-rerank}
      path: ${AI_RERANK_PATH:/api/v1/services/rerank/text-rerank/text-rerank}