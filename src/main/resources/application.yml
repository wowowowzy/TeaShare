server:
  port: 8888
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    # 验证码依赖 HttpSession Cookie。同域反代后为第一方 Cookie，
    # 这里显式声明属性，避免默认值在 HTTPS 下丢失。
    session:
      cookie:
        name: TEA_SESSION
        http-only: true
        # 生产走 HTTPS：Cookie 打上 Secure 标记，只在加密信道传输（防会话嗅探）。
        # 若本地用 http:// 直连后端调试，需在 .env 里临时设 SESSION_COOKIE_SECURE=false，
        # 否则浏览器会拒绝带回该 Cookie，验证码将失效。
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax
        path: /

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.entity
  configuration:
    map-underscore-to-camel-case: true
spring:
  # 本地开发参数从项目根目录的 .env 文件加载（可选：文件不存在也不影响启动）
  # 真实部署时请改为通过系统环境变量注入，环境变量优先级高于此文件
  config:
    import: "optional:file:./.env[.properties]"
  data:
    redis:
      # 缓存（RedisTemplate/StringRedisTemplate）与向量库（RediSearch）统一使用 DB 0
      # RediSearch 只允许在 DB 0 建索引，所以全部放 0
      database: 0
      password: ${REDIS_PASSWORD:}
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 1000ms
  # 一级缓存使用本地 Caffeine（见 CaffeineConfig）。Redis 不再作为 Spring Cache 的实现，
  # 而是由业务代码通过 RedisTemplate 手动读写（商品详情 key 前缀统一在 CacheKeys 中定义），
  # 因此这里不再配置 spring.cache.redis.*，避免出现“配了却不生效”的空配置。
  cache:
    type: caffeine
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:tea}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&allowMultiQueries=true
    password: ${MYSQL_PASSWORD:123456}
    username: ${MYSQL_USERNAME:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: ${OPENAI_BASE_URL}
      chat:
        options:
          model: ${OPENAI_MODEL:deepseek-v4.1-flash}
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:qwen3.7-text-embedding}
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        # auto：listener 方法正常返回后才 ack，抛异常才 nack；这样 ack 与 DB 事务提交对齐
        acknowledge-mode: auto
        # 兜底：漏掉的异常不重回队列，避免毒消息无限重投
        default-requeue-rejected: false
        # 注意：并发调到 1 以上时，seckill:claim:{goodsId}:{userId} 幂等锁是必需的
        concurrency: 1
        max-concurrency: 4
        # 不要用默认 250，避免多消费者时消息饥饿
        prefetch: 1


jwt:
  secret: ${JWT_SECRET}
  expire: ${JWT_EXPIRE:72000000}

alioss:
  access-key-id: ${OSS_ACCESS_KEY_ID}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET}
  bucket-name: ${OSS_BUCKET_NAME}
  endpoint: ${OSS_ENDPOINT}

# ==================== AI 记忆 / RAG 参数 ====================
tea:
  vector:
    # 向量库与缓存统一在 DB 0。
    # RediSearch/Redis Stack 只允许在 DB 0 创建索引（非 0 库 FT.CREATE 会报
    # "Cannot create index on db != 0"），所以这里保持 0，不要改。
    database: ${AI_VECTOR_REDIS_DATABASE:0}
  init:
    # 启动完成后是否执行数据预热（RAG 知识库、商品缓存、帖子关键词、推荐向量）
    enabled: ${APP_INIT_ENABLED:true}
    # true=后台线程执行，不阻塞启动；false=同步执行，启动完成前预热完毕
    async: ${APP_INIT_ASYNC:true}
  mcp:
    express:
      # 快递查询 MCP(DashScope) 的 API Key，禁止硬编码
      api-key: ${MCP_EXPRESS_API_KEY:}
  ai:
    memory:
      # 短期记忆窗口大小
      max-messages: ${AI_MEMORY_MAX_MESSAGES:20}
      # 从 sys_history 单次读取的消息条数（建议 >= max-messages）
      window-size: ${AI_MEMORY_WINDOW_SIZE:20}
      # 长期记忆语义召回条数
      long-term-top-k: ${AI_LTM_TOP_K:5}
    rag:
      # 向量召回条数
      vector-top-k: ${AI_RAG_VECTOR_TOP_K:5}
      # 向量相似度阈值
      similarity-threshold: ${AI_RAG_SIMILARITY_THRESHOLD:0.5}
      # BM25(MySQL 全文) 召回条数
      bm25-top-k: ${AI_RAG_BM25_TOP_K:5}
      # RRF 融合后候选条数
      hybrid-top-k: ${AI_RAG_HYBRID_TOP_K:5}
      # RRF 平滑参数
      rrf-k: ${AI_RAG_RRF_K:60}
      # 是否开启重排
      rerank-enabled: ${AI_RAG_RERANK_ENABLED:true}
      # 重排后送入上下文的条数
      rerank-top-n: ${AI_RAG_RERANK_TOP_N:3}
    rerank:
      # 重排模型（阿里云百炼原生 rerank 路由）
      model: ${AI_RERANK_MODEL:qwen3.7-text-rerank}
      path: ${AI_RERANK_PATH:/api/v1/services/rerank/text-rerank/text-rerank}
